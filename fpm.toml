name = "tandem_rng"
# Unreleased development version; fpm accepts no pre-release suffix such as -dev.
version = "0.1.0"
license = "Apache-2.0"
author = "Jessica Cox"
copyright = "Copyright 2026 Jessica Cox"
description = "Fortran bindings for the Tandem8x32 random number generator"
homepage = "https://github.com/tandem-rng/tandem-fortran"

[build]
auto-executables = false
auto-tests = true
auto-examples = false
link = ["m"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[example]]
name = "bench"
source-dir = "tools"
main = "bench.f90"

# Installs the library and module files, which fpm skips by default.
[install]
library = true
