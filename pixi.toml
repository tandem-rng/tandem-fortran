# Development environments from conda-forge. `pixi run test` builds and tests the CPU module
# with fpm. On a Linux GPU host, `pixi run -e cuda test-cuda` builds and tests the GPU module
# with a CUDA 12.8 toolchain, for hosts without a system install.
[workspace]
name = "tandem-fortran"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
fpm = "*"
gfortran = "*"
clang = "*"
make = "*"
python = ">=3.11"

[activation.env]
FPM_CC = "clang"

[tasks]
test = "fpm test --c-flag -ffp-contract=off --flag '-Wall -Wextra -Werror -std=f2018'"
bench = "fpm run --example bench --profile release --c-flag -ffp-contract=off"
vectors = "python3 tools/gen_vectors.py ../tandem-spec/vectors.json > test/vectors.f90"

[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"
gxx = "13.*"
gcc = "13.*"
gfortran = "13.*"
clang = "*"

[feature.cuda.activation.env]
CC = "clang"

[feature.cuda.tasks]
test-cuda = "make -f cuda/Makefile test"
bench-cuda = "make -f cuda/Makefile bench"

[feature.mpi.dependencies]
mpich = "*"

# On Linux, MPICH runs over UCX, which can fail to open a network device on CI runners. The
# example runs on one node, so shared memory is enough.
[feature.mpi.target.linux-64.activation.env]
UCX_TLS = "self,sm"

[feature.mpi.tasks]
check-mpi = "sh example/mpi/check.sh"

[environments]
cuda = ["cuda"]
mpi = ["mpi"]
