# Development environments from conda-forge. `pixi run test` builds and tests the CPU module
# with fpm. On a Linux GPU host, `pixi run -e cuda test-cuda` builds and tests the GPU module
# with a CUDA 12.8 toolchain, for hosts without a system install.
[workspace]
name = "tandem-fortran"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
fpm = "*"
gfortran = "*"
c-compiler = "*"
make = "*"
python = ">=3.11"

[tasks]
test = "fpm test --flag '-Wall -Wextra -Werror -std=f2018'"
bench = "fpm run --example bench --profile release"
vectors = "python3 tools/gen_vectors.py ../tandem-spec/vectors.json > test/vectors.f90"

# GCC builds the C row loop at about half the speed of clang on Apple silicon.
[target.osx-arm64.tasks]
bench = { cmd = "fpm run --example bench --profile release", env = { FPM_CC = "clang" } }

[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"
gxx = "13.*"
gcc = "13.*"
gfortran = "13.*"

[feature.cuda.tasks]
test-cuda = "make -f cuda/Makefile test"
bench-cuda = "make -f cuda/Makefile bench"

[environments]
cuda = ["cuda"]
