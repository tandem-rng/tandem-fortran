name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # LLVM flang from apt.llvm.org, with the vendored C compiled by clang.
  flang:
    name: ubuntu-latest / flang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install flang
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y flang-21 libflang-21-dev clang-21
          # fpm picks the flag set from the executable name and knows flang-new, not flang-21.
          sudo ln -s "$(command -v flang-21)" /usr/local/bin/flang-new
      - run: pip install fpm
      - name: Build and test
        env:
          FPM_FC: flang-new
          FPM_CC: clang-21
        # flang warns about c_loc of a default logical, which the logical fill needs.
        run: |
          fpm test --c-flag "-ffp-contract=off" --flag "-Werror -Wno-interoperability -std=f2018"
          fpm test --profile release --c-flag "-ffp-contract=off" --flag "-Werror -Wno-interoperability -std=f2018"

  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, compiler: gcc, version: 14, flags: "-Wall -Wextra -Werror -std=f2018", cflags: "-ffp-contract=off"}
          - {os: macos-latest, compiler: gcc, version: 14, flags: "-Wall -Wextra -Werror -std=f2018", cflags: "-ffp-contract=off"}
          # fpm's debug profile passes ifx -fpe0, which flushes subnormals to zero and traps on NaN
          # compares, so subnormal choice weights would read as zero.
          - {os: ubuntu-latest, compiler: intel, version: "2025.1", flags: "-warn all -warn errors -stand f18 -fpe3 -no-ftz", cflags: "-ffp-contract=off"}
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      # The fpm release binary for macOS links Homebrew's gcc@12 runtime; the wheel is self-contained.
      - run: pip install fpm
      - name: Build and test
        env:
          FPM_FC: ${{ steps.setup-fortran.outputs.fc }}
          FPM_CC: ${{ steps.setup-fortran.outputs.cc }}
        run: |
          fpm test --c-flag "${{ matrix.cflags }}" --flag "${{ matrix.flags }}"
          fpm test --profile release --c-flag "${{ matrix.cflags }}" --flag "${{ matrix.flags }}"

  # The OpenMP target and do concurrent fills are plain Fortran, so a host build runs the whole
  # test: gfortran -fopenmp runs the target regions on the CPU, and flang does the same. The GPU
  # builds with nvfortran are run by hand, see the README.
  target:
    name: target fills on the host (gfortran and flang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gfortran, flang and clang
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y gfortran flang-21 libflang-21-dev clang-21 libomp-21-dev
          sudo ln -s "$(command -v flang-21)" /usr/local/bin/flang-new
      - run: make -f target/Makefile test CC=clang-21
      - run: make -f target/Makefile test CC=clang-21 B=build/flang FC=flang-new FFLAGS="-O2 -fopenmp -Wno-interoperability"

  # GitHub runners have no GPU, so CI compiles the CUDA module and its test for sm_80. Run
  # `pixi run -e cuda test-cuda` on a GPU host by hand.
  cuda-build:
    name: CUDA build (pixi toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: cuda
          locked: false
      - run: pixi run -e cuda make -f cuda/Makefile build

  # Against the commits pinned in tools/sync_c.sh, so new upstream commits do not turn CI red.
  vendored:
    name: vendored sources and dumps match the pinned commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git clone -q https://github.com/tandem-rng/tandem-c ../tandem-c
      - run: git clone -q https://github.com/tandem-rng/tandem-cuda ../tandem-cuda
      - run: sh tools/sync_c.sh
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  # The tests read copies of the spec's conformance fixtures, which must equal the pinned commit.
  conformance:
    name: conformance fixtures match tandem-spec 2a4bd08
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git clone -q https://github.com/tandem-rng/spec ../tandem-spec
      - run: git -C ../tandem-spec checkout -q 2a4bd08
      - name: Compare the copies
        working-directory: ../tandem-spec/conformance
        run: |
          for f in *.json; do cmp "$f" "$GITHUB_WORKSPACE/test/conformance/$f"; done
          test "$(ls *.json)" = "$(ls "$GITHUB_WORKSPACE/test/conformance")"

  vectors:
    name: vector module and ziggurat tables are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
      - run: python3 tools/gen_vectors.py ../tandem-spec/vectors.json > test/vectors.f90
      - run: python3 tools/gen_zig_tables.py ../tandem-spec/tables/normal_f64_zig1024.json > cuda/tandem_zig_tables.f90
      - run: git diff --exit-code test/vectors.f90 cuda/tandem_zig_tables.f90
